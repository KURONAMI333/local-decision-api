pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository { maven { url = uri('https://maven.fabricmc.net') } }
            filter { includeGroup('net.fabricmc'); includeGroup('fabric-loom') }
        }
        exclusiveContent {
            forRepository { maven { url = uri('https://repo.spongepowered.org/repository/maven-public') } }
            filter { includeGroupAndSubgroups('org.spongepowered') }
        }
        exclusiveContent {
            forRepository { maven { url = uri('https://maven.minecraftforge.net') } }
            filter { includeGroupAndSubgroups('net.minecraftforge') }
        }
    }
}

plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0' }
rootProject.name = 'local-inference-example'
include('common', 'fabric', 'neoforge')
