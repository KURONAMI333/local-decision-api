plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
    // Forge 1.20.1 cell: pinned to the locally cached plugin so offline builds resolve.
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
}

// キット同梱用のモジュール maven metadata を生成する。
// publish が再利用 build ディレクトリへ書く metadata は過去に公開した全版を
// 列挙するが、キット内 repo はこの版のディレクトリしか持たない。
// 実在しない版を advertise しないよう、同梱版だけを宣言した metadata を作る。
def kitMavenMetadataDir = layout.buildDirectory.dir('kit-maven-metadata/com/kuronami/localinferenceapi/local-inference-api')
tasks.register('generateKitMavenMetadata') {
    inputs.property('kitVersion', project.version.toString())
    outputs.dir(kitMavenMetadataDir)
    doLast {
        def dir = kitMavenMetadataDir.get().asFile
        dir.mkdirs()
        def stamp = new Date().format('yyyyMMddHHmmss', TimeZone.getTimeZone('UTC'))
        def xml = """<?xml version="1.0" encoding="UTF-8"?>
<metadata>
  <groupId>com.kuronami.localinferenceapi</groupId>
  <artifactId>local-inference-api</artifactId>
  <versioning>
    <latest>${project.version}</latest>
    <release>${project.version}</release>
    <versions>
      <version>${project.version}</version>
    </versions>
    <lastUpdated>${stamp}</lastUpdated>
  </versioning>
</metadata>
"""
        def xmlFile = new File(dir, 'maven-metadata.xml')
        xmlFile.setText(xml, 'UTF-8')
        ['md5': 'MD5', 'sha1': 'SHA-1', 'sha256': 'SHA-256', 'sha512': 'SHA-512'].each { ext, algo ->
            def hex = java.security.MessageDigest.getInstance(algo).digest(xmlFile.bytes).collect { String.format('%02x', it) }.join()
            new File(dir, "maven-metadata.xml.${ext}").setText(hex, 'UTF-8')
        }
    }
}

// 配布JARと別に、モデルを含まない小さい開発者キットを再現可能に作る。
tasks.register('developerKit', Zip) {
    dependsOn ':common:publishApiPublicationToDeveloperRepository'
    dependsOn 'generateKitMavenMetadata'
    // Optional generation classifier, e.g. -PdevkitClassifier=r1 produces a
    // repaired-generation kit without overwriting an already-built file.
    def kitClassifier = project.findProperty('devkitClassifier') ? '-' + project.property('devkitClassifier') : ''
    archiveFileName = "local-inference-api-developer-kit-${project.version}${kitClassifier}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('SDK_README.md') { rename { 'README.md' } }
    from('LICENSE')
    from('LICENSING.md')
    from('THIRD_PARTY.md')
    from('runtime/MODEL.md') { into 'runtime' }
    // A reused build directory can contain older API versions. Ship only the
    // version of this kit so the example cannot resolve stale contracts.
    from(layout.buildDirectory.dir("developer-repository/com/kuronami/localinferenceapi/local-inference-api/${project.version}")) {
        into "maven/com/kuronami/localinferenceapi/local-inference-api/${project.version}"
    }
    // The Forge 1.20.1 example targets Java 17. Ship its already-published
    // compile-only API alongside the Java 21 API, without rebuilding either.
    from(layout.buildDirectory.dir("developer-repository/com/kuronami/localinferenceapi/local-inference-api-forge17/${project.version}")) {
        into "maven/com/kuronami/localinferenceapi/local-inference-api-forge17/${project.version}"
    }
    // Module-level maven metadata (latest/release/versions index + checksums)
    // so range/latest resolution works against the bundled repository, not
    // only exact pins. The 1.0.0 kit carried these; 1.0.1/1.0.2 lost them.
    // Generated by generateKitMavenMetadata so it advertises only the version
    // actually bundled in this kit, not every version ever published into the
    // reused developer-repository directory.
    from(kitMavenMetadataDir) {
        into "maven/com/kuronami/localinferenceapi/local-inference-api"
    }
    from('examples/request-classifier') {
        into 'example'
        exclude '**/build/**', '**/.gradle/**', '**/run/**', '**/runs/**', '**/libs/**', '**/*.log', '**/.DS_Store', 'fixture-*/**', 'README.md', 'settings.gradle'
    }
    from('SDK_EXAMPLE_README.md') { into 'example'; rename { 'README.md' } }
    from('SDK_EXAMPLE_SETTINGS.gradle') { into 'example'; rename { 'settings.gradle' } }
    // 配布物の fail-closed EXE gate（loader JAR の verifyNoExecutableContent と同じ検査）。
    doLast {
        exec {
            commandLine 'python3', rootProject.file('tools/exe_scan_gate.py').absolutePath, archiveFile.get().asFile.absolutePath
        }
    }
}
