plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// 内側 JAR は loader の依存 module にせず、通常の resource として運ぶ。
// Fabric remap / NeoForge module 解決から ONNX Runtime の JNI を隔離する。
tasks.named('processResources') {
    dependsOn ':runtime:shadowJar'
    from(rootProject.layout.projectDirectory.file('runtime/build/libs/runtime.jar')) {
        into 'localinferenceapi'
        rename { 'runtime.jar' }
    }
}

// 配布 JAR の fail-closed EXE gate。ネストした archive も含めて PE executable /
// .exe が1件でもあれば build を失敗させる（tools/exe_scan_gate.py）。
tasks.register('verifyNoExecutableContent') {
    group = 'verification'
    description = 'Fail the build if the distribution jar contains a PE executable at any nesting depth.'
    dependsOn tasks.named('assemble')
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!jarFile.isFile()) {
            throw new GradleException("verifyNoExecutableContent: expected build output missing: ${jarFile}")
        }
        exec {
            commandLine 'python3', rootProject.file('tools/exe_scan_gate.py').absolutePath, jarFile.absolutePath
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('verifyNoExecutableContent')
}
